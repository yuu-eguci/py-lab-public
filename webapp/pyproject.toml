# DOC: https://docs.astral.sh/ruff/configuration/#configuring-ruff
[tool.ruff]

target-version = "py314"
line-length = 120

[tool.ruff.lint]
# E: スタイル, F: 論理エラー, I: import 順, UP: 新しい書き方への置き換え, B: バグになりやすい書き方
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [] # 無視するエラーコードがあれば指定

[tool.mypy]
# 外部モジュールを無視
ignore_missing_imports = true
